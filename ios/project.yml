name: Hodeum
options:
  bundleIdPrefix: com.anshlaw
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
packages:
  HodeyCore:
    path: HodeyCore
targets:
  Hodeum:
    type: application
    platform: iOS
    sources: [Hodeum, Shared]
    scheme: {}
    dependencies:
      - package: HodeyCore
      - target: HodeumBroadcast
    info:
      path: Hodeum/Info.plist
      properties:
        CFBundleDisplayName: Hodeum
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, screen-capture]
        NSScreenCaptureUsageDescription: Hodey watches your screen to show you where to tap. Nothing leaves your iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshlaw.hodeum
  HodeumBroadcast:
    type: app-extension
    platform: iOS
    sources: [HodeumBroadcast, Shared]
    info:
      path: HodeumBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Hodeum Screen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshlaw.hodeum.broadcast
