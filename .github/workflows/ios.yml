name: iOS app

# Builds the Hodeum iPhone app without a Mac: unit tests on the macOS host, then two unsigned IPAs
# for sideloading with a free Apple ID (Sideloadly). See docs/ios-sideload.md.
on:
  push:
    branches: [main, feat/ios-app]
    paths: ["ios/**", ".github/workflows/ios.yml", "src/task-packs/iphone-dark-mode.json"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: HodeyCore unit tests
        working-directory: ios/HodeyCore
        run: swift test

  app:
    needs: core-tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Hodeum.xcodeproj -scheme Hodeum -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPAs
        working-directory: ios
        run: bash package-ipas.sh build/Build/Products/Release-iphoneos/Hodeum.app
      - uses: actions/upload-artifact@v4
        with:
          name: Hodeum-ipas
          path: ios/dist/*.ipa
          if-no-files-found: error
