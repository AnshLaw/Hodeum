[package]
name = "hodeum"
version = "0.1.0"
description = "Hodeum local-first AI learning companion"
authors = ["Ansh R. Suryavanshi"]
edition = "2021"

[lib]
name = "hodeum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uiautomation = "0.25"
xcap = "0.9"
base64 = "0.22"
reqwest = { version = "0.13", features = ["gzip"] }
regex = "1"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
rodio = "0.22"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_JobObjects", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Media_Audio", "Win32_System_Com"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
